<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit.css"><script src="../kit.js"></script>
<style>
#bg{position:absolute;inset:0}
#bloom{position:absolute;left:90px;top:330px;width:900px;height:640px;border-radius:50%;filter:blur(40px)}
#drumwrap{position:absolute;left:0;top:640px;width:1080px;height:0;perspective:1500px;perspective-origin:50% 0}
#drum{position:absolute;left:0;top:0;width:1080px;height:0;transform-style:preserve-3d}
.lab{position:absolute;left:0;width:1080px;top:-92px;height:160px;text-align:center;font-size:224px;line-height:160px;backface-visibility:hidden;white-space:nowrap}
.lab span{display:inline-block}
#win{position:absolute;left:60px;right:60px;top:535px;height:210px;border-radius:30px;transform-origin:50% 50%;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 30px 80px rgba(0,0,0,.25)}
.hl{position:absolute;left:70px;right:70px;height:2px;background:linear-gradient(90deg,transparent,rgb(var(--text-rgb) / .35),transparent)}
#tickL,#tickR{position:absolute;top:618px;width:44px;height:44px}
#tickL{left:92px;top:660px}#tickR{right:92px;top:576px}
#eb{position:absolute;left:0;right:0;top:118px;text-align:center}
#idx{position:absolute;left:0;right:0;top:178px;text-align:center;font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:.2em;color:rgb(var(--text-rgb) / .85)}
#dots{position:absolute;left:0;right:0;top:236px;display:flex;justify-content:center;gap:16px}
#dots i{display:block;width:44px;height:6px;border-radius:3px;background:rgb(var(--text-rgb) / .22)}
#cap{position:absolute;left:100px;right:100px;top:1060px;height:120px}
.cp{position:absolute;left:0;right:0;top:0;text-align:center;font-family:var(--sans);font-weight:600;font-size:40px;line-height:1.25;color:rgb(var(--text-rgb) / .9)}
#site{position:absolute;left:0;right:0;top:1236px;text-align:center;font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.16em;color:rgb(var(--text-rgb) / .5)}
</style></head><body><div id="stage">
<div id="bg"></div><div id="bloom"></div>
<div id="eb" class="eyebrow" data-copy="eyebrow"></div>
<div id="idx">01 / 05</div>
<div id="dots"><i></i><i></i><i></i><i></i><i></i></div>
<div id="win"></div>
<div class="hl" style="top:520px;transform:rotate(-6deg)"></div><div class="hl" style="top:760px;transform:rotate(-6deg)"></div>
<svg id="tickL" viewBox="0 0 44 44"><path d="M10 8 L30 22 L10 36" fill="none" style="stroke:var(--text)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
<svg id="tickR" viewBox="0 0 44 44"><path d="M34 8 L14 22 L34 36" fill="none" style="stroke:var(--text)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div id="drumwrap"><div id="drum"></div></div>
<div id="cap"></div>
<div id="site" data-copy="footer"></div>
<div class="grain"></div><div class="vignette"></div>
</div>
<script>
window.DUR=6; window.POSTER=3.3;
const {seg,smoother,lerp,outExpo,inExpo,premium,emph,accel,$,$$,css,clamp}=K;
// COPY: eyebrow = top line, words = the 5 drum labels (≤ 7 letters each; the drum is built for exactly 5),
// captions = one line under the drum per word (≤ 40 chars reads best), footer = URL line.
const COPY = K.copy({
  eyebrow:'Lumen · How it works',
  words:['Sketch','Animate','Review','Share','Export'],
  captions:['Start from a rough idea.','Bring every layer to life.','Get notes right on the frame.','Invite your team in one click.','Export anywhere, any size.'],
  footer:'lumen.app'
});
K.fill(COPY);
const W=COPY.words, CAP=COPY.captions;
// Per-step background hues + the dim label colour, read from the theme on the first frame (render.mjs injects --theme after load).
let HUE=null, DIM=null;
window.onTheme=()=>{HUE=null;};   // render.mjs calls this after injecting --theme
function readTheme(){
  const c=n=>K.color(n).map(v=>v*255), mx=(a,b,u)=>a.map((v,i)=>v+(b[i]-v)*u), dk=(a,f)=>a.map(v=>Math.round(v*f));
  const bg=c('--bg'), sat=(a,k)=>{const g=(a[0]+a[1]+a[2])/3; return a.map(v=>Math.round(Math.min(255,Math.max(0,g+(v-g)*k))));};
  HUE=[dk(c('--primary'),1), dk(mx(c('--accent-lo'),bg,.15),.95), dk(mx(c('--warm-lo'),bg,.12),.95), sat(dk(mx(c('--pop'),bg,.2),.85),1.4), sat(dk(mx(c('--primary-hi'),c('--accent-lo'),.35),.8),1.4)];
  DIM=dk(mx(c('--primary-hi'),c('--text'),.15),.9);
}
const N=10, STEP=36, R=360, ST=DUR/5;
const drum=$('#drum'), cap=$('#cap');
const labs=[...Array(N)].map((_,i)=>{const d=document.createElement('div');d.className='lab display';d.innerHTML=`<span>${W[i%5]}</span>`;drum.appendChild(d);return d;});
const caps=CAP.map(c=>{const d=document.createElement('div');d.className='cp';d.textContent=c;cap.appendChild(d);return d;});
const mix=(a,b,u)=>a.map((v,i)=>Math.round(lerp(v,b[i],u)));
window.frame=function(t){
  if(!HUE) readTheme();
  t=((t%DUR)+DUR)%DUR; const ph=t/DUR, TAU=2*Math.PI;
  const k=Math.floor(t/ST), f=t-k*ST;
  // move: snappy (0→0.55 s) with readable landing; hold has a slow 2° creep
  const mv=premium(seg(f,0,.55)), creep=smoother(seg(f,.55,ST))*0.0;
  const pos=k+.94*mv+.06*smoother(seg(f,.3,ST)); // in items, with a slow creep through the hold
  const ang=pos*STEP;
  css(drum,{transform:`translateZ(${-R}px) rotateZ(-6deg)`});
  labs.forEach((el,i)=>{
    let a=i*STEP-ang; a=((a+180)%360+360)%360-180;      // relative angle, -180..180
    const ad=Math.abs(a), d=ad/STEP;                    // distance in items
    const act=clamp(1-d);                                // 1 when centred
    const op = ad>100?0:lerp(1,.0,Math.pow(clamp(ad/96),.8));
    const sc = lerp(1,.62,clamp(d));
    css(el,{transform:`rotateX(${(-a).toFixed(3)}deg) translateZ(${R}px) scale(${sc.toFixed(4)})`,opacity:op.toFixed(3),
      color:`color-mix(in srgb,var(--text) ${(act*100).toFixed(1)}%,rgb(${DIM.join(',')}))`,
      textShadow:`0 0 ${(40*act).toFixed(1)}px rgba(255,255,255,${(.25*act).toFixed(3)})`,
      filter:`blur(${(clamp(d-.15)*3.2).toFixed(2)}px)`});
  });
  // background hue flows with the active item
  const ci=k%5, ni=(k+1)%5;
  const hc=mix(HUE[ci],HUE[ni],mv), hc2=mix(HUE[ci],HUE[ni],premium(seg(f,.1,.75)));
  $('#bg').style.background=`radial-gradient(75% 55% at 50% 47%,rgba(${hc},.55) 0%,rgba(${hc2},.18) 45%,rgb(var(--bg-rgb)) 85%),var(--bg)`;
  $('#bloom').style.background=`radial-gradient(closest-side,rgba(${hc},.55),transparent)`;
  css('#bloom',{transform:`scale(${(1+.04*Math.sin(TAU*ph*5)).toFixed(4)})`});
  // active window pulse on landing
  const land=Math.exp(-Math.max(0,f-.45)*7)*smoother(seg(f,.3,.45));
  css('#win',{transform:`rotate(-6deg) scale(${(1+.015*land).toFixed(4)})`,boxShadow:`inset 0 0 0 2px rgba(255,255,255,${(.18+.3*land).toFixed(3)}),0 0 ${(60*land).toFixed(0)}px rgba(${hc},${(.6*land).toFixed(3)}),0 30px 80px rgba(0,0,0,.25)`});
  const nudge=Math.sin(Math.PI*seg(f,0,.5))*10;
  css('#tickL',{transform:`rotate(-6deg) translateX(${nudge.toFixed(1)}px)`}); css('#tickR',{transform:`rotate(-6deg) translateX(${(-nudge).toFixed(1)}px)`});
  // index + progress pips
  const act=(k+(mv>.5?1:0))%5;
  $('#idx').textContent=`0${act+1} / 0${W.length}`;
  $$('#dots i').forEach((d,i)=>{const on=i===act; d.style.background=on?`rgb(${hc})`:'rgb(var(--text-rgb) / .22)'; d.style.width=on?'88px':'44px';});
  // captions: outgoing leaves fast before the incoming lands
  caps.forEach((c,i)=>{
    let o=0,y=0,b=0;
    if(i===ci){const u=inExpo(seg(f,0,.22)); o=1-u; y=-u*30; b=u*6;}
    if(i===ni){const u=outExpo(seg(f,.42,.95)); o=Math.max(o,u)*(f>.3?1:0); if(f>.3){y=(1-u)*36; b=(1-u)*6;}}
    css(c,{opacity:o.toFixed(3),transform:`translateY(${y.toFixed(1)}px)`,filter:`blur(${b.toFixed(2)}px)`});
  });
};
frame(0);
</script></body></html>
