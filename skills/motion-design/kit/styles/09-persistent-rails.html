<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit.css"><script src="../kit.js"></script>
<style>
/* --soft / --soft2: lighter tints of --primary-hi used for the right-hand source and its rail */
#stage{--soft:color-mix(in srgb,var(--primary-hi) 62%,var(--text));--soft2:color-mix(in srgb,var(--primary-hi) 40%,var(--text))}
#bg{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 84%,color-mix(in srgb,var(--bg3) 85%,var(--primary-lo)) 0%,color-mix(in srgb,var(--bg2) 60%,transparent) 50%,transparent 80%),radial-gradient(80% 60% at 50% 30%,var(--bg2) 0%,var(--bg) 75%)}
svg{position:absolute;left:0;top:0}
.src{position:absolute;top:150px;transform:translateX(-50%)}
.src .chip{white-space:nowrap;font-size:26px;padding:16px 28px;background:color-mix(in srgb,var(--bg2) 90%,transparent)}
#srcL{left:170px}#srcR{left:910px}
#srcL .chip{box-shadow:inset 0 0 0 2px rgb(var(--accent-rgb) / .7),0 0 40px rgb(var(--accent-rgb) / .3)}
#srcR .chip{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--soft) 80%,transparent),0 0 40px color-mix(in srgb,var(--primary-hi) 35%,transparent)}
#srcR .chip i{background:var(--soft)}
#head{position:absolute;left:0;right:0;top:432px;height:270px;text-align:center}
.wd{position:absolute;left:0;right:0;top:0;font-size:156px;line-height:.86;white-space:nowrap}
#kick{position:absolute;left:0;right:0;top:372px;text-align:center;font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.2em;color:rgb(var(--text-rgb) / .6)}
#sub{position:absolute;left:230px;right:230px;top:730px;text-align:center;font-family:var(--sans);font-weight:600;font-size:32px;line-height:1.3;color:rgb(var(--text-rgb) / .82)}
#hub{position:absolute;left:220px;top:960px;width:640px;height:270px;border-radius:44px;overflow:hidden;
  background:linear-gradient(165deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 40%,rgb(var(--accent-rgb) / .08) 75%,rgba(255,255,255,.16));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 0 0 12px rgba(255,255,255,.06),0 40px 90px rgba(0,0,0,.5)}
#hubglow{position:absolute;left:150px;top:880px;width:780px;height:440px;border-radius:50%;background:radial-gradient(closest-side,rgb(var(--accent-rgb) / .5),rgb(var(--primary-rgb) / .35) 45%,transparent);filter:blur(10px)}
#liq{position:absolute;left:0;top:0}
#hlab{position:absolute;left:0;right:0;top:72px;text-align:center;font-size:116px;color:var(--text);text-shadow:0 4px 30px rgb(var(--bg-rgb) / .6)}
#hk{position:absolute;left:0;right:0;top:36px;text-align:center;font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.24em;color:rgb(var(--text-rgb) / .8)}
#hsheen{position:absolute;inset:-30%;mix-blend-mode:screen;pointer-events:none}
#site{position:absolute;left:0;right:0;top:1270px;text-align:center;font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.16em;color:rgb(var(--text-rgb) / .45)}
</style></head><body><div id="stage">
<div id="bg"></div>
<div id="hubglow"></div>
<svg width="1080" height="1350" viewBox="0 0 1080 1350"><defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--primary-hi)"/></linearGradient>
  <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--soft)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient>
 </defs>
 <g id="rails"></g><g id="drops"></g>
 <circle id="nl" cx="170" cy="262" r="10" style="fill:var(--accent)"/><circle id="nr" cx="910" cy="262" r="10" style="fill:var(--soft)"/>
</svg>
<div class="src" id="srcL"><div class="chip"><i></i><span data-copy="sourceL"></span></div></div>
<div class="src" id="srcR"><div class="chip"><i></i><span data-copy="sourceR"></span></div></div>
<div id="kick" data-copy="kicker"></div>
<div id="head" class="display">
  <div class="wd" id="w0"><span data-copy="lead1"></span><br><span style="color:var(--accent)" data-copy="word1"></span></div>
  <div class="wd" id="w1"><span data-copy="lead2"></span><br><span style="color:var(--soft)" data-copy="word2"></span></div>
  <div class="wd" id="w2"><span data-copy="lead3"></span><br><span class="foiltext" id="w2f" data-copy="word3"></span></div>
</div>
<div id="sub" data-copy="sub"></div>
<div id="hub">
  <svg id="liq" width="640" height="270"><defs><linearGradient id="lq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.85"/><stop offset=".5" style="stop-color:var(--primary);stop-opacity:.9"/><stop offset="1" style="stop-color:var(--primary-lo)"/></linearGradient></defs>
    <path id="wv2" style="fill:var(--primary-hi)" opacity=".35"/><path id="wv" fill="url(#lq)"/></svg>
  <div id="hk" data-copy="hubKicker"></div>
  <div id="hlab" class="display" data-copy="hubLabel"></div>
  <div id="hsheen"></div>
</div>
<div id="site" data-copy="footer"></div>
<div class="grain"></div><div class="vignette"></div>
</div>
<script>
window.DUR=6; window.POSTER=4.9;
// COPY: sourceL/sourceR = the two input chips, kicker = small line above the headline,
// lead1-3 + word1-3 = the three 2 s headline beats (word ≤ 7 letters), sub = one-line explainer (≤ 40 chars), hubKicker/hubLabel = the destination container, footer = URL.
const COPY = K.copy({
  sourceL:'Sketches', sourceR:'Clips', kicker:'LUMEN · WHERE WORK GOES',
  lead1:'Every', word1:'sketch', lead2:'Every', word2:'clip', lead3:'Fills the', word3:'library',
  sub:'Sketches and clips land in one library.',
  hubKicker:'LUMEN', hubLabel:'Library', footer:'lumen.app'
});
K.fill(COPY);
const {seg,smoother,lerp,outExpo,inExpo,premium,emph,accel,$,$$,css,clamp}=K;
const NS='http://www.w3.org/2000/svg';
const mk=(tag,at,par)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e;};
// rails: 2 per side, from source node down the outer edge and sweeping into the hub mouth
const railDefs=[];
[[170,1,'l'],[910,-1,'r']].forEach(([x,dir,side])=>{
  [-13,13].forEach((o,k)=>{
    const x0=x+o, xm=540-dir*(92-o*dir*0.6);
    const d=`M${x0} 280 L${x0} 640 C${x0} 840 ${xm} 800 ${xm} 975`;
    railDefs.push({d,side,k});
  });
});
const railsG=$('#rails'), dropsG=$('#drops');
const R=railDefs.map(r=>{
  const glow=mk('path',{d:r.d,fill:'none',style:r.side=='l'?'stroke:var(--accent)':'stroke:var(--soft)','stroke-width':8,filter:'url(#glow)',opacity:.35},railsG);
  const line=mk('path',{d:r.d,fill:'none',stroke:`url(#g${r.side})`,'stroke-width':2.4,opacity:.8},railsG);
  const flow=mk('path',{d:r.d,fill:'none',stroke:'#fff','stroke-width':2,'stroke-dasharray':'2 22','stroke-linecap':'round',opacity:.35},railsG);
  const L=line.getTotalLength();
  // drops: 3 per rail, each makes 2 passes per loop → seamless
  const drops=[0,1,2].map(j=>{const g=mk('g',{},dropsG);
    const halo=mk('circle',{r:16,style:r.side=='l'?'fill:var(--accent)':'fill:var(--soft)',filter:'url(#glow)',opacity:.7},g);
    const tr=[0,1,2,3].map(q=>mk('circle',{r:6-q*1.2,style:r.side=='l'?'fill:var(--accent)':'fill:var(--soft2)',opacity:.5-q*.1},g));
    const core=mk('ellipse',{rx:8,ry:11,fill:'#fff'},g);
    return {g,halo,tr,core,j};});
  return {...r,glow,line,flow,L,drops};
});
const W0=$('#w0'),W1=$('#w1'),W2=$('#w2');
const ease = p=>p<.0?0:Math.pow(p,1.35); // gravity-ish acceleration down the rail
window.frame=function(t){
  t=((t%DUR)+DUR)%DUR; const ph=t/DUR, TAU=2*Math.PI;
  // emphasis per phase: 0-2 left source, 2-4 right source, 4-6 both → hub
  const bump=(a,b)=>smoother(seg(t,a,a+.4))*(1-smoother(seg(t,b-.4,b)));
  const eB = Math.max(bump(-1,2),bump(6,9)) , eS=bump(2,4), eV=bump(4,6.4);
  const eBb = t<2?smoother(seg(t,0,0.01))*(1-smoother(seg(t,1.6,2))):0; // left-source phase (wraps from previous loop end)
  const wB = t<2?1-smoother(seg(t,1.6,2.0)):smoother(seg(t,5.6,6.0));
  const wS = smoother(seg(t,2.0,2.4))*(1-smoother(seg(t,3.6,4.0)));
  const wV = smoother(seg(t,4.0,4.4))*(1-smoother(seg(t,5.6,6.0)));
  let pulse=0, emitB=0, emitS=0;
  R.forEach(r=>{
    const w = r.side=='l' ? Math.max(wB,wV*.85) : Math.max(wS,wV*.85);
    const lvl = .45+.55*w;
    r.glow.setAttribute('opacity',(.18+.4*w).toFixed(3));
    r.line.setAttribute('opacity',(.45+.5*w).toFixed(3));
    r.flow.setAttribute('stroke-dashoffset',(-ph*24*20*(r.k?1:1.0)).toFixed(1));
    r.flow.setAttribute('opacity',(.15+.35*w).toFixed(3));
    r.drops.forEach(dp=>{
      const off=(r.side=='r'?.17:0)+r.k*.5+dp.j/3;
      const p=((ph*2+off)%1+1)%1;            // 2 passes per loop
      const s=ease(p);
      const pt=r.line.getPointAtLength(s*r.L), pt2=r.line.getPointAtLength(Math.max(0,s-.012)*r.L);
      const ang=Math.atan2(pt.y-pt2.y,pt.x-pt2.x)*180/Math.PI-90;
      const born=smoother(seg(p,0,.06)), sink=1-smoother(seg(p,.93,1));
      const a=born*sink*lvl;
      dp.g.setAttribute('opacity',a.toFixed(3));
      dp.core.setAttribute('transform',`translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)}) rotate(${ang.toFixed(1)}) scale(${(.8+.6*s).toFixed(3)} ${(1+.8*s).toFixed(3)})`);
      dp.halo.setAttribute('cx',pt.x.toFixed(1)); dp.halo.setAttribute('cy',pt.y.toFixed(1)); dp.halo.setAttribute('r',(12+8*w).toFixed(1));
      dp.tr.forEach((c,q)=>{const pq=r.line.getPointAtLength(Math.max(0,s-(q+1)*.02*(.6+s))*r.L);c.setAttribute('cx',pq.x.toFixed(1));c.setAttribute('cy',pq.y.toFixed(1));});
      pulse=Math.max(pulse,Math.exp(-p*16)*lvl);
      if(r.side=='l')emitB=Math.max(emitB,Math.exp(-p*14)); else emitS=Math.max(emitS,Math.exp(-p*14));
    });
  });
  // sources
  const sbw=Math.max(wB,wV*.85), ssw=Math.max(wS,wV*.85);
  css('#srcL',{transform:`translateX(-50%) scale(${(1+.06*sbw).toFixed(4)})`,opacity:(.55+.45*sbw).toFixed(3)});
  css('#srcR',{transform:`translateX(-50%) scale(${(1+.06*ssw).toFixed(4)})`,opacity:(.55+.45*ssw).toFixed(3)});
  $('#nl').setAttribute('r',(8+6*emitB).toFixed(2)); $('#nr').setAttribute('r',(8+6*emitS).toFixed(2));
  // headline swaps: outgoing leaves (up, fast) before incoming lands
  const word=(el,a,b)=>{ // in at a, out at b (seconds, can wrap)
    let ti=((t-a)%DUR+DUR)%DUR, span=((b-a)%DUR+DUR)%DUR;
    const i=emph(clamp(ti/.55)), o=inExpo(clamp((ti-(span-.3))/.3));
    const vis = ti<span ? 1 : 0;
    css(el,{opacity:(vis*smoother(clamp(ti/.35))*(1-o)).toFixed(3),transform:`translateY(${(vis?(1-i)*70-o*60:0).toFixed(1)}px)`,filter:`blur(${(vis?(1-i)*8+o*10:0).toFixed(2)}px)`});
  };
  word(W0,0.0,2.0); word(W1,2.0,4.0); word(W2,4.0,6.0);
  $('#w2f').style.backgroundPosition=`${(ph*183.33).toFixed(2)}% 0`;
  // hub: liquid wave (periodic), glow pulses on arrivals, stronger in hub phase
  const lvlY=130, amp=7+4*pulse;
  const wave=(ph0,a)=>{let d=`M0 270 L0 ${lvlY}`;for(let x=0;x<=640;x+=20){d+=` L${x} ${(lvlY+Math.sin(x/58+TAU*ph0)*a+Math.sin(x/23-TAU*2*ph0)*a*.35).toFixed(1)}`;}return d+' L640 270 Z';};
  $('#wv').setAttribute('d',wave(ph*2,amp)); $('#wv2').setAttribute('d',wave(-ph*2+.3,amp*1.2).replace(/ (\d+(\.\d+)?)\b/g,(m)=>m));
  $('#wv2').setAttribute('transform','translate(0 -10)');
  const vg=.55+.25*pulse+.3*wV;
  css('#hubglow',{opacity:clamp(vg).toFixed(3),transform:`scale(${(1+.05*pulse+.05*wV).toFixed(4)})`});
  css('#hub',{transform:`scale(${(1+.012*pulse+.02*wV).toFixed(4)})`});
  const sh=ph;
  $('#hsheen').style.background=`linear-gradient(110deg,transparent ${20+sh*80}%,rgba(255,255,255,.25) ${26+sh*80}%,transparent ${32+sh*80}%)`;
  css('#head',{transform:`scale(${(1+.02*Math.sin(TAU*ph)).toFixed(4)})`});
};
frame(0);
</script></body></html>
