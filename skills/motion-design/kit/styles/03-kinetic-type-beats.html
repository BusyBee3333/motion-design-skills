<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit.css"><script src="../kit.js"></script>
<style>
.beat{position:absolute;inset:0;overflow:hidden;display:none}
.beat .bgfill{position:absolute;inset:0}
.beat .edge{position:absolute;background:var(--accent)}
.beat .block{position:absolute;left:60px;right:60px;top:180px;bottom:200px;display:flex;flex-direction:column;justify-content:center;transform-origin:50% 50%}
.line{position:relative;overflow:hidden;line-height:.80;padding-top:.035em;white-space:nowrap;align-self:flex-start}
.line .in{display:block;font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.005em;transform-origin:0 80%}
.foil{background:var(--foil);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:22px;border-radius:11px;background:var(--foil);background-size:220% 100%;margin-top:26px;transform-origin:0 50%}
#hud{position:absolute;inset:0;z-index:20;pointer-events:none;font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.16em;text-transform:uppercase}
#hud .tl{position:absolute;left:60px;top:64px}
#hud .tr{position:absolute;right:60px;top:64px}
#hud .bl{position:absolute;left:60px;bottom:66px;letter-spacing:.08em;text-transform:none}
#hud .prog{position:absolute;right:60px;bottom:74px;display:flex;gap:8px}
#hud .prog i{display:block;width:34px;height:8px;border-radius:4px;background:currentColor;opacity:.25}
#hud .prog i b{display:block;height:100%;border-radius:4px;background:currentColor;transform-origin:0 50%}
</style></head><body><div id="stage">
<div id="beats"></div>
<div id="hud"><div class="tl" data-copy="hudBrand"></div><div class="tr" id="cnt">01 / 08</div><div class="bl" data-copy="hudFooter"></div><div class="prog" id="prog"></div></div>
<div class="grain" style="z-index:21"></div><div class="vignette" style="opacity:.6;z-index:21"></div>
</div>
<script>
window.DUR=4.8; window.POSTER=2.1;
const {seg,smoother,lerp,outExpo,inExpo,premium,inOutSine,emph,$,$$,css,spring,clamp,outBack}=K;
// COPY: hudBrand = top-left label; hudFooter = bottom-left line; beats = 8 beats, each an array of 1-2 lines (≤ 8 chars per line reads best)
const COPY = K.copy({
  hudBrand:'Lumen · Make it move', hudFooter:'Ideas, in motion.',
  beats:[['Plan.'],['Build.'],['Ship','it.'],['Every','idea.'],['One','draft.'],['Many','moves.'],['Make it','move'],['Make it','move.']]
});
K.fill(COPY);
// theme roles (CSS vars resolve at paint time, so --theme overrides apply)
const INK='var(--bg)',VIO='var(--primary)',ICE='var(--accent)',PAP='var(--text)';
const B=0.6;
// entry: cut | pop | mask | slamL | slamB | slamR ; col: colour per line (last entry repeats), 'foil' = foil gradient
const STYLE=[
 {bg:VIO,hud:PAP,entry:'cut', col:[PAP]},
 {bg:PAP,hud:INK,entry:'slamB',edge:VIO,col:[INK],pop:true},
 {bg:INK,hud:PAP,entry:'mask',col:[PAP,ICE]},
 {bg:INK,hud:PAP,entry:'cut', col:[PAP,'foil'],bar:true},
 {bg:ICE,hud:INK,entry:'slamR',edge:VIO,col:[INK]},
 {bg:INK,hud:PAP,entry:'pop', col:[PAP,'foil']},
 {bg:VIO,hud:PAP,entry:'slamL',edge:ICE,col:[PAP],mask:true},
 {bg:INK,hud:PAP,entry:'cut', col:[PAP,'foil'],bar:true},
];
const beats=STYLE.map((b,i)=>({...b,lines:COPY.beats[i].map((tx,j)=>[tx,b.col[Math.min(j,b.col.length-1)]])}));
const root=$('#beats');
beats.forEach((b,i)=>{
  const d=document.createElement('div'); d.className='beat'; d.style.zIndex=i+1;
  d.innerHTML=`<div class="bgfill" style="background:${b.bg}"></div><div class="edge"></div><div class="block">${
    b.lines.map(([tx,c])=>`<div class="line"><span class="in ${c==='foil'?'foil':''}" style="${c==='foil'?'':'color:'+c}">${tx}</span></div>`).join('')
  }${b.bar?'<div class="bar"></div>':''}</div>`;
  if(b.edge) d.querySelector('.edge').style.background=b.edge;
  root.appendChild(d); b.el=d; b.lineEls=[...d.querySelectorAll('.line')]; b.inEls=[...d.querySelectorAll('.line .in')];
  b.barEl=d.querySelector('.bar'); b.blockEl=d.querySelector('.block'); b.edgeEl=d.querySelector('.edge');
});
const prog=$('#prog'); beats.forEach(()=>{const i=document.createElement('i');i.innerHTML='<b></b>';prog.appendChild(i);});
const progB=[...prog.querySelectorAll('b')];
// fit each line to the block width (Scher-style justified stack), measured once fonts are loaded
let fitted=false;
document.fonts.load('900 100px "Big Shoulders Display"');
function fit(){
  if(fitted||!document.fonts.check('900 100px "Big Shoulders Display"'))return;
  beats.forEach(b=>{
    const n=b.inEls.length, cap=n===1?600:500;
    b.el.style.display='block';
    b.inEls.forEach(el=>{el.style.fontSize='100px'; const w=el.getBoundingClientRect().width;
      el.style.fontSize=Math.min(cap,100*960/w)+'px';});
  });
  fitted=true;
}
window.frame=function(t){
  t=((t%DUR)+DUR)%DUR; fit();
  const cur=Math.floor(t/B);
  beats.forEach((b,i)=>{
    const st=i*B, u=t-st;
    // visible during own beat; slam beats stay under the next slam until covered
    const nxt=beats[(i+1)%beats.length];
    const tail=nxt.entry.startsWith('slam')?0.16:0;
    const on=u>=0&&u<B+tail;
    b.el.style.display=on?'block':'none'; if(!on)return;
    // entry block slam (fast, readable landing)
    let clip='none';
    if(b.entry.startsWith('slam')){
      const p=outExpo(seg(u,0,0.16)), q=(1-p)*100;
      clip=b.entry==='slamB'?`inset(${q}% 0 0 0)`:b.entry==='slamR'?`inset(0 0 0 ${q}%)`:`inset(0 ${q}% 0 0)`;
      const e=b.edgeEl, ew=46, vis=1-smoother(seg(u,0.12,0.26));
      if(b.entry==='slamB') css(e,{left:0,right:0,top:`${q}%`,height:ew+'px',width:'auto',opacity:vis});
      else if(b.entry==='slamR') css(e,{top:0,bottom:0,left:`${q}%`,width:ew+'px',height:'auto',opacity:vis});
      else css(e,{top:0,bottom:0,left:`calc(${100-q}% - ${ew}px)`,width:ew+'px',height:'auto',opacity:vis});
    } else css(b.edgeEl,{opacity:0});
    b.el.style.clipPath=clip;
    // whole block: slow push during the beat (no dead hold)
    const push=1+0.035*seg(u,0,B);
    let bs=push, by=0;
    if(b.entry==='cut'){ bs*=lerp(1.07,1,outExpo(seg(u,0,0.22))); }
    if(b.entry==='pop'||b.pop){ /* per line below */ }
    css(b.blockEl,{transform:`translateY(${by}px) scale(${bs})`});
    const td=b.entry.startsWith('slam')?0.07:0;  // text lands just after the slam
    b.lineEls.forEach((ln,j)=>{
      const inn=b.inEls[j], d=td+j*0.06;
      if(b.entry==='mask'||b.mask){
        const p=outExpo(seg(u,d,d+0.3));
        css(inn,{transform:`translateY(${(1-p)*105}%)`});
      } else if(b.entry==='pop'||b.pop){
        const s=lerp(0.55,1,spring(u-d,320,17));
        css(inn,{transform:`scale(${s})`,opacity:smoother(seg(u,d,d+0.05))});
      } else if(b.entry.startsWith('slam')){
        const p=outExpo(seg(u,d,d+0.25));
        const dx=b.entry==='slamR'?1:-1;
        css(inn,{transform:`translateX(${dx*(1-p)*140}px)`,opacity:smoother(seg(u,d,d+0.08))});
      } else css(inn,{transform:'none',opacity:1});
      if(inn.classList.contains('foil')) inn.style.backgroundPosition=`${lerp(0,140,seg(u,0,B))}% 0`;
    });
    if(b.barEl){ const p=outExpo(seg(u,0.08,0.4)); css(b.barEl,{transform:`scaleX(${p})`,backgroundPosition:`${lerp(0,140,seg(u,0,B))}% 0`}); }
  });
  // HUD follows the current beat's palette
  const cb=beats[cur];
  $('#hud').style.color=cb.hud;
  $('#cnt').textContent=`0${cur+1} / 0${beats.length}`;
  progB.forEach((e,i)=>{e.style.transform=`scaleX(${i<cur?1:i===cur?premium(seg(t-cur*B,0,B)):0})`;});
};
frame(0);
</script></body></html>
