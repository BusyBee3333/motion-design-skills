<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit.css"><script src="../kit.js"></script>
<style>
#bg{position:absolute;inset:0;background:radial-gradient(70% 52% at 50% 46%,color-mix(in srgb,var(--bg3) 80%,var(--primary-lo)) 0%,color-mix(in srgb,var(--bg) 55%,var(--bg2)) 55%,var(--bg) 100%)}
#halo{position:absolute;left:140px;top:180px;width:800px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgb(var(--primary-rgb) / .5),transparent);filter:blur(30px)}
#cam{position:absolute;inset:0;transform-origin:540px 640px}
.sw{position:absolute;left:540px;top:640px;width:0;height:0}
.sw .slab{left:calc(-210px*var(--s));top:calc(-350px*var(--s));backdrop-filter:none}
.sw .dim{position:absolute;inset:0;border-radius:inherit;background:rgb(var(--deep-rgb));pointer-events:none}
/* card colourways for the 2nd and 3rd case (theme roles) */
.c-accent{background:linear-gradient(170deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent-lo))!important}
.c-primary{background:linear-gradient(170deg,color-mix(in srgb,var(--primary-hi) 70%,#fff),var(--primary))!important}
.c-accent .art:not([style*='--art']){background:radial-gradient(60% 55% at 50% 52%,var(--text) 0 12%,transparent 13%),conic-gradient(from 20deg at 50% 52%,var(--primary-lo),var(--primary),var(--accent),var(--text),var(--primary-lo))!important}
.c-primary .art:not([style*='--art']){background:radial-gradient(60% 55% at 50% 52%,var(--text) 0 12%,transparent 13%),conic-gradient(from 120deg at 50% 52%,var(--pop),var(--warm),var(--accent),var(--primary),var(--pop))!important}
.c-primary .name{color:var(--text)!important}
#eb{position:absolute;left:0;right:0;top:84px;text-align:center}
#head{position:absolute;left:0;right:0;top:1140px;text-align:center;font-size:120px}
</style></head><body><div id="stage">
<div id="bg"></div><div id="halo"></div>
<div id="cam"></div>
<div id="eb" class="eyebrow" data-copy="eyebrow"></div>
<div id="head" class="display"><span class="foiltext" id="h1" data-copy="headline"></span></div>
<div class="grain"></div><div class="vignette"></div>
</div>
<script>
window.DUR=6; window.POSTER=3.7;
const {seg,smoother,lerp,clamp,outExpo,inExpo,premium,emph,$,$$,css}=K;
const S=1.2;
// COPY: eyebrow = top label; headline = foil line shown while fanned (≤ 16 chars); caseTitle = title on every case label;
// cards = the 3 showcase cases {name, eyebrow, number} (hero first; the hero repeats last to close the loop)
const COPY = K.copy({
  eyebrow:'Lumen', headline:'Every project', caseTitle:'SHOWCASE',
  cards:[{name:'Lumen Wisp',eyebrow:'LUMEN · NO. 0001',number:'01'},{name:'Tidal Glyph',eyebrow:'LUMEN · NO. 0417',number:'02'},{name:'Nova Moth',eyebrow:'LUMEN · NO. 0862',number:'03'}]
});
K.fill(COPY);
// Optional: your own art for the 3 cases (image URLs, hero first). Empty = generated theme art.
const CARD_ART=[];
// stack order: 0 = the hero (also the loop start), 1..2 arrivals, 3 = copy of hero landing last
const DEF=[{c:'',k:0},{c:'c-accent',k:1},{c:'c-primary',k:2},{c:'',k:0}];
DEF.forEach((d,i)=>{const w=document.createElement('div');w.className='sw'; const cd=COPY.cards[d.k], art=CARD_ART[d.k];
  w.innerHTML=`<div class="slab" style="--s:${S}"><div class="slab-label"><div class="l1">${cd.eyebrow}</div><div class="l2">${COPY.caseTitle}</div><div class="grade">${cd.number}</div></div>
  <div class="slab-window"><div class="card ${d.c}"><div class="art"${art?` style="--art:url(${art})"`:''}></div><div class="name">${cd.name}</div><div class="meta"></div></div></div><div class="glare"></div><div class="dim"></div></div>`;
  $('#cam').appendChild(w); d.w=w; d.s=w.querySelector('.slab'); d.dim=w.querySelector('.dim');});
const ARR=[null,0.25,0.8,1.35], AD=0.72; // arrival start times, duration
const FAN=[2.2,3.25], COL=[4.3,5.15];
const DX=150, DY=-118;
window.frame=function(t){
  t=((t%DUR)+DUR)%DUR;
  const ph=2*Math.PI*t/DUR;
  // fan amount (0 stacked, 1 fanned) with tiny stagger per copy
  const fanK=k=>{const st=(k-1)*0.05; return t<4? smoother(seg(t,FAN[0]+st,FAN[1]+st)) : 1-premium(seg(t,COL[0]+(3-k)*0.04,COL[1]+(3-k)*0.04));};
  const breathe=1+0.05*Math.sin(2*Math.PI*(t-3.2)/2.2)*smoother(seg(t,3.0,3.4))*(1-smoother(seg(t,4.1,4.4)));
  // how many arrivals have landed: copies sit behind the top slab with a small peek offset
  DEF.forEach((d,i)=>{
    let y=0,x=0,rot=0,rx=0,blur=0,op=1,sc=1,dim=0;
    if(i>0){ // arrival from below
      const u=seg(t,ARR[i],ARR[i]+AD);
      const p=outExpo(u), f=smoother(seg(t,ARR[i]+0.08,ARR[i]+AD*0.8));
      y=(1-p)*1150; x=(1-p)*60; rot=(1-p)*7; rx=(1-p)*22; blur=(1-f)*18;
      op=t<ARR[i]?0:1;
    }
    // depth in the stack = number of slabs that landed on top of this one (fractional while landing)
    let depth=0; for(let j=i+1;j<4;j++) depth+=smoother(seg(t,ARR[j]+0.15,ARR[j]+AD));
    // as the loop closes, the hidden copies settle exactly behind the top and fade out
    const settle=smoother(seg(t,5.15,5.85));
    const kk=3-i; // fan index for copies behind the front (front = 3)
    const fk=i<3?fanK(kk):0;
    const peek=depth*(1-settle);
    x+= fk*DX*kk*breathe; y+= fk*DY*kk*breathe - peek*16;
    sc*= 1-0.035*peek - 0.02*fk*kk; rot+= fk*2.2*kk;
    dim=clamp(peek*0.2,0,.55)*(1-fk) + fk*0.08*kk;
    if(i<3) op*= 1-settle;
    if(i===0 && t<0.3) op=1;
    d.w.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) perspective(1600px) rotateX(${rx.toFixed(2)}deg) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
    d.w.style.opacity=op.toFixed(3); d.w.style.filter=blur>0.05?`blur(${blur.toFixed(2)}px)`:'none';
    d.dim.style.opacity=dim.toFixed(3);
    d.s.style.setProperty('--g',(lerp(-0.35,1.35,smoother(seg(t,ARR[i]||0,(ARR[i]||0)+1.2)))+ (i===3?0.9*smoother(seg(t,3.0,4.6)):0)).toFixed(3));
  });
  // camera: slow push while stacking, pull back + re-centre on the fan, push back in on resolve
  const pb = t<4? premium(seg(t,2.15,3.3)) : 1-premium(seg(t,4.3,5.2));
  const push=0.03*Math.sin(ph-1.2);
  const cs=lerp(1,0.68,pb)*(1+push);
  const cx=-DX*1.5*pb*0.68, cy=-DY*1.5*pb*0.68 + lerp(0,-70,pb);
  $('#cam').style.transform=`translate(${cx.toFixed(1)}px,${cy.toFixed(1)}px) scale(${cs.toFixed(4)})`;
  // headline only while fanned (enters after the move, leaves before the collapse)
  const hi=outExpo(seg(t,2.85,3.45)), ho=inExpo(seg(t,4.0,4.3));
  css('#head',{opacity:(hi*(1-ho)).toFixed(3),transform:`translateY(${((1-hi)*50-ho*30).toFixed(1)}px)`});
  css('#h1',{backgroundPosition:`${(t/DUR)*220}% 0`});
  css('#halo',{transform:`translate(${(pb*60).toFixed(1)}px,${(-pb*40).toFixed(1)}px) scale(${(1+pb*.25).toFixed(3)})`});
};
frame(0);
</script></body></html>
