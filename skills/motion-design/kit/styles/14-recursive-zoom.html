<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit.css"><script src="../kit.js"></script>
<style>
#bg{position:absolute;inset:0;background:var(--bg)}
.level{position:absolute;left:0;top:0;width:1080px;height:1350px;will-change:transform}
.level .slab{left:210px;top:90px}
.level .slab-window{background:color-mix(in srgb,var(--bg) 60%,var(--bg2));overflow:hidden;display:block}
.level .slab-window svg{position:absolute;left:0;top:0;width:100%;height:100%}
#cap{position:absolute;left:0;right:0;bottom:0;height:230px;background:linear-gradient(180deg,rgb(var(--bg-rgb) / 0),rgb(var(--bg-rgb) / .85) 55%,rgb(var(--bg-rgb) / .95))}
#capt{position:absolute;left:0;right:0;top:1218px;text-align:center;font-size:84px}
#capk{position:absolute;left:0;right:0;top:1180px;text-align:center}
#topk{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(180deg,rgb(var(--bg-rgb) / .6),rgb(var(--bg-rgb) / 0))}
</style></head><body><div id="stage">
<div id="bg"></div>
<div id="levels"></div>
<div id="topk"></div>
<div id="cap"></div>
<div id="capk" class="eyebrow" data-copy="kicker"></div>
<div id="capt" class="display"><span style="color:var(--text)" data-copy="captionA"></span> <span class="foiltext" id="cf" data-copy="captionB"></span></div>
<div class="grain"></div><div class="vignette"></div>
</div>
<script>
window.DUR=5; window.POSTER=0;
// COPY: kicker = small line above the caption, captionA/captionB = fixed caption (plain + foil part, ≤ 22 chars total),
// caseEyebrow (≤ 18 chars)/caseTitle/caseNumber = label on the showcase case, roomSign = sign above the hub door, plinth = label on the pedestal.
const COPY = K.copy({
  kicker:'Lumen', captionA:'Ideas,', captionB:'in motion.',
  caseEyebrow:'LUMEN · NO. 0001', caseTitle:'SHOWCASE', caseNumber:'01',
  roomSign:'THE LIBRARY', plinth:'ON DISPLAY'
});
K.fill(COPY);
// ART HOOK: set to an image URL to replace the vector hub room inside each case window with your own picture
// (the next, smaller case still sits on top, so the recursion keeps working; keep the pedestal area roughly where it is).
const ROOM_IMG=null;
const {seg,smoother,lerp,clamp,$,$$,css}=K;
// Geometry (screen px at eff scale 1). Slab 660x1100 at (210,90); window = kit insets.
const S=660/420, SL=210, STOP=90, SW=660, SH=1100;
const WX=SL+SW*.08, WY=STOP+SH*.225, WW=SW*.84, WH=SH*.73;   // window rect
const Z=4;                                // self-similar ratio
const CIN=[540,868], COUT=[540,640];      // inner slab centre, outer slab centre
const P=[540,(CIN[1]-COUT[1]/Z)/(1-1/Z)]; // fixed point of the zoom
// Hub room art (the destination container) in window-local coords (WW x WH)
const iw=SW/Z, ih=SH/Z, icx=CIN[0]-WX, icy=CIN[1]-WY;   // inner slab in window coords
const vx=icx, vy=icy-30;                                 // vanishing point / hub door centre
function room(){
  const w=WW,h=WH, fl=icy+ih/2;   // floor line at pedestal top
  let shelves='';
  for(let r=0;r<3;r++)for(let c=0;c<2;c++){
    [0,1].forEach(side=>{
      const x= side? w-46-c*40 : 18+c*40, y=70+r*92;
      shelves+=`<rect x="${x}" y="${y}" width="28" height="46" rx="4" fill="url(#shelfg)" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>
                <rect x="${x+4}" y="${y+4}" width="20" height="7" rx="1.5" opacity=".85" style="fill:var(--text)"/>
                <rect x="${x+5}" y="${y+15}" width="18" height="26" rx="2" opacity=".75" style="fill:${(r+c+side)%2?'var(--warm)':'var(--accent)'}"/>`;
    });
  }
  let floor='';
  for(let i=-6;i<=6;i++){ floor+=`<line x1="${vx}" y1="${vy}" x2="${vx+i*120}" y2="${h+40}" stroke-width="1" style="stroke:rgb(var(--accent-rgb) / .12)"/>`; }
  for(let i=0;i<6;i++){ const y=fl+18+Math.pow(i/5,1.8)*(h-fl-10); floor+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke-width="1" style="stroke:rgb(var(--accent-rgb) / ${(.06+i*.025).toFixed(3)})"/>`; }
  let rings='';
  [190,160,128,96].forEach((r,i)=>{ rings+=`<circle cx="${vx}" cy="${vy}" r="${r}" fill="none" stroke-width="${i==0?3:1.5}" ${i==1?'stroke-dasharray="3 9"':''} style="stroke:${i%2?'rgb(var(--accent-rgb) / .28)':'color-mix(in srgb,color-mix(in srgb,var(--primary-hi) 62%,var(--text)) 35%,transparent)'}"/>`; });
  let bolts=''; for(let i=0;i<12;i++){const a=i/12*Math.PI*2; bolts+=`<circle cx="${(vx+Math.cos(a)*175).toFixed(1)}" cy="${(vy+Math.sin(a)*175).toFixed(1)}" r="4" style="fill:rgb(var(--text-rgb) / .55)"/>`;}
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs>
    <radialGradient id="wallg" cx="${vx/w}" cy="${vy/h}" r=".75"><stop offset="0" style="stop-color:color-mix(in srgb,var(--primary-lo) 80%,var(--bg3))"/><stop offset=".55" style="stop-color:color-mix(in srgb,var(--bg2) 82%,var(--primary-lo))"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--bg) 85%,var(--bg2))"/></radialGradient>
    <linearGradient id="floorg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb,var(--bg3) 85%,var(--primary-lo))"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--bg) 85%,rgb(var(--deep-rgb)))"/></linearGradient>
    <linearGradient id="shelfg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-opacity=".5" style="stop-color:var(--accent)"/><stop offset="1" stop-opacity=".4" style="stop-color:var(--primary)"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-opacity=".0" style="stop-color:var(--accent)"/><stop offset=".25" stop-opacity=".22" style="stop-color:color-mix(in srgb,var(--accent) 60%,#fff)"/><stop offset="1" stop-opacity=".05" style="stop-color:var(--accent)"/></linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-opacity=".55" style="stop-color:var(--accent)"/><stop offset="1" stop-opacity="0" style="stop-color:var(--accent)"/></radialGradient>
    <linearGradient id="ped" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--bg3)"/><stop offset=".5" style="stop-color:color-mix(in srgb,var(--primary-lo) 70%,var(--primary))"/><stop offset="1" style="stop-color:var(--bg3)"/></linearGradient>
  </defs>
  <rect width="${w}" height="${h}" fill="url(#wallg)"/>
  <rect y="${fl}" width="${w}" height="${h-fl}" fill="url(#floorg)"/>
  ${floor}
  <polygon points="0,0 70,40 70,${fl-6} 0,${fl+30}" style="fill:rgb(var(--deep-rgb) / .55)"/>
  <polygon points="${w},0 ${w-70},40 ${w-70},${fl-6} ${w},${fl+30}" style="fill:rgb(var(--deep-rgb) / .55)"/>
  ${shelves}
  <circle cx="${vx}" cy="${vy}" r="205" style="fill:rgb(var(--primary-rgb) / .18)"/>
  ${rings}${bolts}
  <polygon points="${vx-40},0 ${vx+40},0 ${vx+iw*.9},${fl+10} ${vx-iw*.9},${fl+10}" fill="url(#beam)"/>
  <ellipse cx="${icx}" cy="${fl+22}" rx="${iw*1.05}" ry="26" fill="url(#pool)"/>
  <rect x="${icx-iw*.62}" y="${fl}" width="${iw*1.24}" height="44" fill="url(#ped)"/>
  <ellipse cx="${icx}" cy="${fl}" rx="${iw*.62}" ry="12" stroke-width="1.5" style="fill:var(--primary);stroke:rgb(var(--accent-rgb) / .7)"/>
  <ellipse cx="${icx}" cy="${fl+44}" rx="${iw*.62}" ry="12" style="fill:var(--bg2)"/>
  <text x="${icx}" y="${fl+36}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11" letter-spacing="2" style="fill:rgb(var(--text-rgb) / .75)">${COPY.plinth}</text>
  <text x="${vx}" y="34" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="14" letter-spacing="4" style="fill:rgb(var(--accent-rgb) / .8)">${COPY.roomSign}</text>
  </svg>`;
}
const ROOM=ROOM_IMG?`<div style="position:absolute;inset:0;background:url(${ROOM_IMG}) center/cover no-repeat"></div>`:room();
const lvHTML=`<div class="slab" style="--s:${S}"><div class="slab-label"><div class="l1">${COPY.caseEyebrow}</div><div class="l2">${COPY.caseTitle}</div><div class="grade">${COPY.caseNumber}</div></div>
  <div class="slab-window">${ROOM}</div><div class="glare"></div></div>`;
const NL=5, levels=[];
for(let j=0;j<NL;j++){const d=document.createElement('div');d.className='level';d.innerHTML=lvHTML;d.style.transformOrigin=`${P[0]}px ${P[1]}px`;$('#levels').appendChild(d);levels.push(d);}
window.frame=function(t){
  t=((t%DUR)+DUR)%DUR; const ph=t/DUR;
  // camera: exponential push (constant perceived speed) with a gentle periodic surge
  const u=ph-0.5*Math.sin(2*Math.PI*ph)/(2*Math.PI);
  const s=Math.pow(Z,u);
  levels.forEach((el,i)=>{
    const j=1-i;                       // i=0 outermost (eff s*Z), then s, s/Z, ...
    const eff=s*Math.pow(Z,j);
    // everything below is a pure function of eff → seamless
    const B=clamp((eff-1.7)*2.2,0,9);  // screen-space depth blur for layers past the lens
    const far=clamp((Math.log(eff)/Math.log(Z)+2.2)/0.8); // fade out the tiniest level
    const br=lerp(.72,1,clamp(1-Math.abs(Math.log(eff)/Math.log(Z))*.5));
    css(el,{transform:`scale(${eff.toFixed(6)})`,filter:`blur(${(B/eff).toFixed(3)}px) brightness(${br.toFixed(3)})`,opacity:far.toFixed(3)});
    const g=Math.log(eff)/Math.log(Z); el.querySelector('.slab').style.setProperty('--g',(((g%1)+1)%1*1.6-.4).toFixed(3));
  });
  $('#cf').style.backgroundPosition=`${(ph*183.333).toFixed(2)}% 0`;
};
frame(0);
</script></body></html>
