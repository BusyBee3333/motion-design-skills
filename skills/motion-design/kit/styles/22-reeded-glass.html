<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit.css"><script src="../kit.js"></script>
<style>
#gl{position:absolute;left:0;top:0;width:1080px;height:1350px}
#fontwarm{position:absolute;left:-9999px;top:0;opacity:0}
</style></head><body><div id="stage">
<canvas id="gl" width="2160" height="2700"></canvas>
<div id="fontwarm"><span style="font-family:var(--display);font-weight:900">A</span><span style="font-family:var(--mono);font-weight:700">A</span><span style="font-family:var(--sans);font-weight:600">A</span></div>
<div class="grain"></div><div class="vignette"></div>
</div>
<script>
// Reeded glass: the whole scene (showcase case + type) is drawn once to a 2x canvas and uploaded as a texture; a fluted-glass panel
// slides across in a fragment shader. Each flute samples a magnified sliver around its own centre (after the reeded mode of
// Leonxlnx/lumenshaders), with per-channel dispersion, ridge shading, groove lines and a bevelled panel edge.
window.DUR=5.6; window.POSTER=1.0;
const {seg,smoother,outExpo,inExpo,premium,css,$}=K;
// COPY keys: eyebrow (top mono line), headline (big foil line, <= ~16 chars), sub (one short line under it),
// caseEyebrow / caseTitle / caseNumber (the showcase case label), cardName (name printed on the card).
const COPY = K.copy({eyebrow:'Lumen', headline:'Make it move', sub:'From draft to done.',
  caseEyebrow:'LUMEN · NO. 0022', caseTitle:'SHOWCASE', caseNumber:'01', cardName:'Glass Heron'});
// HERO_IMG: put your own image path here (product shot, screenshot, art) to replace the generated card art.
const HERO_IMG = '';
let heroImg=null; if(HERO_IMG){ heroImg=new Image(); heroImg.onload=()=>{themeKey='';}; heroImg.src=HERO_IMG; }
// theme colours are read lazily (render.mjs injects --theme after load), never at top level
const hx=n=>K.hex(n);
const rgbv=(n,a)=>`rgb(${getComputedStyle(document.documentElement).getPropertyValue(n).trim()} / ${a})`;
const S=2, W=1080, H=1350;
const SL={x:282,y:150,w:516,h:860,r:30}; // showcase case rect (scene px)
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function foilGrad(c,x0,y0,x1,y1){const g=c.createLinearGradient(x0,y0,x1,y1);[['--accent',0],['--primary-hi',.26],['--pop',.5],['--warm',.74],['--accent',1]].forEach(([k,o])=>g.addColorStop(o,hx(k)));return g;}
function drawScene(){
  const cv=document.createElement('canvas'); cv.width=W*S; cv.height=H*S; const c=cv.getContext('2d'); c.scale(S,S);
  // backdrop: ink + soft studio lights (they become colour bars behind the flutes)
  c.fillStyle=hx('--bg'); c.fillRect(0,0,W,H);
  const blob=(x,y,r,role,a)=>{const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,K.rgba(role,a));g.addColorStop(1,K.rgba(role,0));c.fillStyle=g;c.fillRect(0,0,W,H);};
  blob(540,560,620,'--primary',.55);
  blob(170,250,420,'--accent',.22);
  blob(930,900,460,'--pop',.16);
  blob(880,180,360,'--primary-hi',.35);
  // floor glow
  blob(540,1060,420,'--accent',.10);
  // --- showcase case ---
  const {x,y,w,h,r}=SL, s=w/420;
  c.save(); c.shadowColor='rgba(0,0,0,.5)'; c.shadowBlur=80; c.shadowOffsetY=40; rr(c,x,y,w,h,r); c.fillStyle=K.rgba('--bg3',.9); c.fill(); c.restore();
  c.save(); c.shadowColor=K.rgba('--primary',.6); c.shadowBlur=70; rr(c,x,y,w,h,r); c.fillStyle=K.rgba('--bg3',.6); c.fill(); c.restore();
  rr(c,x,y,w,h,r); let g=c.createLinearGradient(x,y,x+w*.7,y+h); g.addColorStop(0,'rgba(255,255,255,.34)');g.addColorStop(.38,'rgba(255,255,255,.07)');g.addColorStop(.7,K.rgba('--accent',.12));g.addColorStop(1,'rgba(255,255,255,.24)'); c.fillStyle=g; c.fill();
  c.lineWidth=2.4; c.strokeStyle='rgba(255,255,255,.62)'; rr(c,x+1.2,y+1.2,w-2.4,h-2.4,r-1); c.stroke();
  c.lineWidth=10; c.strokeStyle='rgba(255,255,255,.07)'; rr(c,x+7,y+7,w-14,h-14,r-6); c.stroke();
  // showcase case label
  const lx=x+w*.06, ly=y+h*.042, lw=w*.88, lh=h*.15;
  c.save(); rr(c,lx,ly,lw,lh,10*s); c.clip(); c.fillStyle=hx('--text'); c.fillRect(lx,ly,lw,lh); c.fillStyle=hx('--primary'); c.fillRect(lx,ly,10*s,lh);
  c.fillStyle=foilGrad(c,lx+lw*.74,ly,lx+lw,ly+lh); c.fillRect(lx+lw*.74,ly,lw*.26,lh);
  c.fillStyle=hx('--primary-lo'); c.font=`700 ${14*s}px "JetBrains Mono"`; c.letterSpacing=`${14*s*.16}px`; c.fillText(COPY.caseEyebrow,lx+28*s,ly+30*s);
  c.letterSpacing='0px'; c.fillStyle=hx('--bg'); c.font=`900 ${40*s}px "Big Shoulders Display"`; c.fillText(COPY.caseTitle.toUpperCase(),lx+28*s,ly+70*s);
  c.font=`900 ${58*s}px "Big Shoulders Display"`; c.textAlign='center'; c.fillText(COPY.caseNumber,lx+lw*.87,ly+lh*.5+20*s); c.textAlign='left';
  c.restore();
  // window + card
  const wx=x+w*.08, wy=y+h*.225, ww=w*.84, wh=h*(1-.225-.045);
  rr(c,wx,wy,ww,wh,14*s); c.fillStyle=rgbv('--deep-rgb',.62); c.fill(); c.lineWidth=2*s; c.strokeStyle='rgba(255,255,255,.18)'; c.stroke();
  const cw=ww*.86, ch=wh*.92, cx=wx+(ww-cw)/2, cy=wy+(wh-ch)/2;
  c.save(); c.shadowColor='rgba(0,0,0,.4)'; c.shadowBlur=18*s; c.shadowOffsetY=6*s; rr(c,cx,cy,cw,ch,14*s);
  g=c.createLinearGradient(cx,cy,cx+cw*.3,cy+ch); g.addColorStop(0,hx('--warm')); g.addColorStop(1,hx('--warm-lo')); c.fillStyle=g; c.fill(); c.restore();
  const ax=cx+cw*.06, ay=cy+ch*.06, aw=cw*.88, ah=ch*.58;
  c.save(); rr(c,ax,ay,aw,ah,8*s); c.clip();
  if(heroImg&&heroImg.complete&&heroImg.naturalWidth){ // HERO_IMG, drawn with object-fit: cover
    const k=Math.max(aw/heroImg.naturalWidth,ah/heroImg.naturalHeight), iw=heroImg.naturalWidth*k, ih=heroImg.naturalHeight*k;
    c.drawImage(heroImg,ax+(aw-iw)/2,ay+(ah-ih)/2,iw,ih);
  } else {
  const cg=c.createConicGradient(200*Math.PI/180-Math.PI/2,ax+aw/2,ay+ah*.52); ['--primary','--accent','--pop','--warm','--primary'].forEach((k,i)=>cg.addColorStop(i/4,hx(k)));
  c.fillStyle=cg; c.fillRect(ax,ay,aw,ah);
  c.strokeStyle='rgba(255,255,255,.16)'; c.lineWidth=2*s; for(let k=-ah;k<aw+ah;k+=16*s){c.beginPath();c.moveTo(ax+k,ay+ah);c.lineTo(ax+k+ah*.58,ay);c.stroke();}
  c.fillStyle=hx('--text'); c.beginPath(); c.ellipse(ax+aw/2,ay+ah*.52,aw*.072,aw*.066,0,0,7); c.fill();
  }
  c.restore();
  c.fillStyle=hx('--bg'); c.font=`900 ${34*s}px "Big Shoulders Display"`; c.fillText(COPY.cardName.toUpperCase(),cx+cw*.07,cy+ch*.68+30*s);
  rr(c,cx+cw*.07,cy+ch*.79,cw*.86,ch*.12,6*s); c.fillStyle=K.rgba('--bg',.12); c.fill();
  // type
  c.textAlign='center';
  c.fillStyle=hx('--accent'); c.font='700 22px "JetBrains Mono"'; c.letterSpacing='4px'; c.fillText(COPY.eyebrow.toUpperCase(),540,96); c.letterSpacing='0px';
  c.font='900 132px "Big Shoulders Display"'; c.fillStyle=foilGrad(c,160,0,920,0); c.fillText(COPY.headline.toUpperCase(),540,1176);
  c.fillStyle=K.rgba('--text',.84); c.font='600 34px "Instrument Sans"'; c.fillText(COPY.sub,540,1250);
  return cv;
}
const FS=`#version 300 es
precision highp float;
uniform vec2 R; uniform sampler2D sc; uniform float L, Wg, zoom, glare, ph;
uniform vec3 ICE, WARM, VHI;   // theme: --accent, --text, --primary-hi (set from K.color each frame)
out vec4 o;
#define PI 3.14159265359
vec2 toUV(vec2 px){ px=(px-vec2(540.,640.))/zoom+vec2(540.,640.); return px/vec2(1080.,1350.); }
vec3 tap(vec2 px){ return texture(sc,toUV(px)).rgb; }
vec3 soft(vec2 px){ return tap(px)*.28+(tap(px+vec2(2.5,0.))+tap(px-vec2(2.5,0.)))*.2+(tap(px+vec2(0.,3.))+tap(px-vec2(0.,3.)))*.16; }
void main(){
  vec2 px=gl_FragCoord.xy/R*vec2(1080.,1350.); px.y=1350.-px.y;
  vec3 sharp=tap(px);
  // glare sweep on the showcase case (scene space) while it is clear
  vec2 sp=(px-vec2(540.,640.))/zoom+vec2(540.,640.);
  vec2 q=(sp-vec2(282.,150.))/vec2(516.,860.);
  if(q.x>0.&&q.x<1.&&q.y>0.&&q.y<1.){
    float d=q.x*.8+q.y*.45 - (glare*1.9-.45);
    sharp+=(WARM*.42*exp(-d*d*260.)+ICE*.16*exp(-pow(d-.05,2.)*90.))*smoothstep(0.,.02,q.x)*smoothstep(1.,.98,q.x);
  }
  vec3 col=sharp;
  float x0=px.x-L;
  if(x0>-40.&&x0<Wg+40.){
    float rib=34.;
    float ci=floor(x0/rib), lx=fract(x0/rib)-.5;
    float cxr=L+(ci+.5)*rib;
    float bow=sin(lx*PI);
    // magnified, slightly bowed sliver per flute + per-channel dispersion
    float yb=px.y+ (bow*bow)*3.;
    vec3 g;
    g.r=soft(vec2(cxr-lx*rib*.55+bow*9.,yb)).r;
    g.g=soft(vec2(cxr-lx*rib*.42+bow*9.,yb)).g;
    g.b=soft(vec2(cxr-lx*rib*.29+bow*9.,yb)).b;
    float ridge=cos(lx*PI);
    g*=.80+.26*ridge;
    float groove=smoothstep(.5,.43,abs(lx));
    g*=mix(.42,1.,groove);
    g+=WARM*pow(max(ridge,0.),30.)*.10;
    g+=WARM*smoothstep(.5,.47,abs(lx-.43))*.05;                // thin rim light on each flute
    // broad sheen across the panel
    float sh=exp(-pow((px.x-L-Wg*.35 + px.y*.35 - 300.)/260.,2.));
    g+=mix(ICE,VHI,.4)*sh*.07;
    g=g*vec3(.95,.98,1.04)+vec3(.02,.02,.045);    // faint cool glass body
    float inside=smoothstep(-1.,1.,x0)*smoothstep(Wg+1.,Wg-1.,x0);
    col=mix(col,g,inside);
    // bevelled panel edges
    float e1=abs(x0), e2=abs(x0-Wg);
    float edge=min(e1,e2);
    col+=WARM*(exp(-edge*edge/3.)*.75 + exp(-edge/26.)*.10);
    col+=ICE*exp(-pow((x0-5.)/4.,2.))*.25*inside;
  }
  o=vec4(col,1.);
}`;
const cv=$('#gl'), gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});
const shd=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;};
const pr=gl.createProgram();gl.attachShader(pr,shd(gl.VERTEX_SHADER,'#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0,1);}'));gl.attachShader(pr,shd(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.viewport(0,0,cv.width,cv.height);
const U=n=>gl.getUniformLocation(pr,n); gl.uniform2f(U('R'),cv.width,cv.height); gl.uniform1i(U('sc'),0);
const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
// the scene texture is rebuilt whenever fonts finish loading or the theme changes (cheap key check each frame)
let themeKey='';
const ROLES=['--bg','--bg3','--primary','--primary-hi','--primary-lo','--accent','--text','--warm','--warm-lo','--pop','--deep-rgb'];
function build(){ gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,drawScene());
  gl.uniform3fv(U('ICE'),K.color('--accent')); gl.uniform3fv(U('WARM'),K.color('--text')); gl.uniform3fv(U('VHI'),K.color('--primary-hi')); }
window.onTheme=()=>{themeKey='';};
window.frame=function(t){
  t=((t%DUR)+DUR)%DUR;
  const cs=getComputedStyle(document.documentElement), key=document.fonts.status+ROLES.map(r=>cs.getPropertyValue(r)).join();
  if(key!==themeKey){ build(); themeKey=key; }
  const Wg=1500;
  // glass: covers (0) -> slides off right 0.45-1.95 -> clear hold -> re-enters from left 3.75-5.15 -> covered
  let L;
  if(t<2.6) L=K.lerp(-210,1110,premium(seg(t,0.45,1.95)));
  else L=K.lerp(-1500-60,-210,K.inOutCubic(seg(t,3.75,5.15)));
  const zoom=1+0.035*(t<2.6? K.smooth(seg(t,0.4,2.6)) : 1-K.smooth(seg(t,2.6,5.6)));
  gl.uniform1f(U('L'),L); gl.uniform1f(U('Wg'),Wg); gl.uniform1f(U('zoom'),zoom); gl.uniform1f(U('ph'),t/DUR);
  gl.uniform1f(U('glare'),K.inOutSine(seg(t,1.75,3.45)));
  gl.drawArrays(gl.TRIANGLES,0,3);
};
document.fonts.ready.then(()=>{themeKey='';});
frame(0);
</script></body></html>
